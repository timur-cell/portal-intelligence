name: Deploy to GitHub Pages

# Publishes the repo root (static site — index.html + data JSON) to GitHub Pages.
# One-time setup: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main, claude/hello-lYzZd]   # main = production; the branch lets you preview before merge
  workflow_dispatch:                        # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .            # whole repo root (no build step)
      - id: deployment
        uses: actions/deploy-pages@v4
